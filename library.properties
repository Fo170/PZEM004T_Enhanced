sentence=Bibliothèque Arduino pour le compteur d'énergie PZEM-004T v3.0 (Modbus/RS485) avec calcul de la puissance apparente (S = P/PF) et de la puissance non-active (N = √(S²-P²)).
paragraph=Basée sur la bibliothèque de Jakub Mandula (2019, licence MIT). Ajoute S = P/PF et N = √(S²-P²) (le PF mesuré est global, il inclut les harmoniques ; N = √(Q²+D²)), readAddress(), des constructeurs par référence et le support ESP32 (broches RX/TX). Compatible HardwareSerial et SoftwareSerial (AVR, ESP8266).
