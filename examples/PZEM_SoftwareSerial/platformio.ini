; PZEM004T_Enhanced - Exemple SoftwareSerial
; Compilation : pio run -d examples/PZEM_SoftwareSerial
; (ou : cd examples/PZEM_SoftwareSerial && pio run)

[platformio]
src_dir = .

[env:uno]
platform = atmelavr
board = uno
framework = arduino
lib_deps = file://../..

[env:esp8266]
platform = espressif8266
board = esp12e
framework = arduino
lib_deps = file://../..
